<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>NovaPlay Live Support</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #170709;
    --surface: #2A0F14;
    --surface-alt: #33141A;
    --border: rgba(240, 185, 61, 0.28);
    --gold: #F0B93D;
    --crimson: #C4172C;
    --crimson-light: #FF4D5E;
    --text: #FFFFFF;
    --text-secondary: #CBB4B8;
    --text-muted: #8E7377;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot { width: 9px; height: 9px; border-radius: 999px; background: #3ECF8E; }
  header h1 { font-size: 16px; margin: 0; color: var(--gold); }
  header .sub { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--crimson);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.admin {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
  }
  .meta { font-size: 10px; opacity: 0.65; margin-top: 4px; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #text {
    flex: 1;
    resize: none;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 100px;
  }
  #send {
    border: none;
    background: var(--crimson);
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    padding: 0 18px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; }
  #expired {
    display: none;
    margin: auto;
    padding: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 320px;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Live Support</h1>
  <div class="sub">NovaPlay team</div>
</header>

<div id="messages"></div>

<div id="expired">
  This chat link has expired. Please reopen <b>Live Support</b> from the NovaPlay app to start a new session.
</div>

<div id="composer">
  <textarea id="text" rows="1" placeholder="Type your message…"></textarea>
  <button id="send">Send</button>
</div>

<script>
  var API = location.origin;
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || sessionStorage.getItem('novaplay_chat_token');

  if (params.get('token')) {
    sessionStorage.setItem('novaplay_chat_token', params.get('token'));
    history.replaceState(null, '', location.pathname);
  }

  var messagesEl = document.getElementById('messages');
  var textEl = document.getElementById('text');
  var sendBtn = document.getElementById('send');
  var expiredEl = document.getElementById('expired');
  var composerEl = document.getElementById('composer');
  var lastCount = 0;

  function showExpired() {
    expiredEl.style.display = 'block';
    messagesEl.style.display = 'none';
    composerEl.style.display = 'none';
  }

  if (!token) {
    showExpired();
  } else {
    boot();
  }

  function bubbleHtml(m) {
    var cls = m.sender === 'USER' ? 'user' : 'admin';
    var time = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return '<div class="bubble ' + cls + '">' + escapeHtml(m.text) + '<div class="meta">' + time + '</div></div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render(messages) {
    if (messages.length === 0) {
      messagesEl.innerHTML = '<div class="bubble system">Send a message and our team will reply here shortly.</div>';
    } else {
      messagesEl.innerHTML = messages.map(bubbleHtml).join('');
    }
    messagesEl.scrollTop = messagesEl.scrollHeight;
    lastCount = messages.length;
  }

  function loadChat() {
    fetch(API + '/support/chat', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) {
        if (r.status === 401) { showExpired(); throw new Error('expired'); }
        return r.json();
      })
      .then(function (data) {
        if (data.messages.length !== lastCount) render(data.messages);
      })
      .catch(function () {});
  }

  function send() {
    var text = textEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    fetch(API + '/support/chat/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ text: text }),
    })
      .then(function (r) {
        if (r.status === 401) { showExpired(); throw new Error('expired'); }
        return r.json();
      })
      .then(function () {
        textEl.value = '';
        loadChat();
      })
      .catch(function () {})
      .finally(function () { sendBtn.disabled = false; });
  }

  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function boot() {
    loadChat();
    setInterval(loadChat, 4000);
  }
</script>

</body>
</html>
