<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex" />
<title>NovaPlay Live Support</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #170709;
    --surface: #2A0F14;
    --surface-alt: #33141A;
    --border: rgba(240, 185, 61, 0.28);
    --gold: #F0B93D;
    --crimson: #C4172C;
    --crimson-light: #FF4D5E;
    --text: #FFFFFF;
    --text-secondary: #CBB4B8;
    --text-muted: #8E7377;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, Segoe UI, Roboto, Helvetica, Arial, sans-serif;
  }
  body { display: flex; flex-direction: column; }
  header {
    padding: 16px 20px;
    border-bottom: 1px solid var(--border);
    display: flex;
    align-items: center;
    gap: 10px;
  }
  header .dot { width: 9px; height: 9px; border-radius: 999px; background: #3ECF8E; }
  header h1 { font-size: 16px; margin: 0; color: var(--gold); }
  header .sub { font-size: 12px; color: var(--text-muted); margin-left: auto; }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 16px;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .bubble {
    max-width: 78%;
    padding: 10px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .bubble.user {
    align-self: flex-end;
    background: var(--crimson);
    color: #fff;
    border-bottom-right-radius: 4px;
  }
  .bubble.admin {
    align-self: flex-start;
    background: var(--surface);
    border: 1px solid var(--border);
    border-bottom-left-radius: 4px;
  }
  .bubble.system {
    align-self: center;
    background: transparent;
    color: var(--text-muted);
    font-size: 12px;
    text-align: center;
  }
  .meta { font-size: 10px; opacity: 0.65; margin-top: 4px; }
  #composer {
    display: flex;
    gap: 8px;
    padding: 12px;
    border-top: 1px solid var(--border);
    background: var(--surface);
  }
  #text {
    flex: 1;
    resize: none;
    background: var(--surface-alt);
    border: 1px solid var(--border);
    border-radius: 12px;
    color: var(--text);
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    max-height: 100px;
  }
  #send {
    border: none;
    background: var(--crimson);
    color: #fff;
    font-weight: 700;
    border-radius: 12px;
    padding: 0 18px;
    cursor: pointer;
  }
  #send:disabled { opacity: 0.5; }
  .bubble a { color: var(--gold); word-break: break-all; }
  #notice {
    font-size: 12px;
    color: var(--text-secondary);
    background: var(--surface-alt);
    border-bottom: 1px solid var(--border);
    padding: 8px 16px;
  }
  .chips-title { font-size: 12px; color: var(--text-muted); margin: 4px 0 0; }
  .chips { display: flex; flex-wrap: wrap; gap: 8px; }
  .chip {
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    border-radius: 999px;
    padding: 8px 14px;
    font-size: 13px;
    font-family: inherit;
    cursor: pointer;
  }
  .chip:active { background: var(--surface-alt); }
  #expired {
    display: none;
    margin: auto;
    padding: 24px;
    text-align: center;
    color: var(--text-secondary);
    font-size: 14px;
    max-width: 320px;
  }
</style>
</head>
<body>

<header>
  <div class="dot"></div>
  <h1>Live Support</h1>
  <div class="sub">NovaPlay team</div>
</header>

<div id="notice">🔔 Stay alert: NovaPlay staff will never ask for your OTP or password. Don't share them with anyone.</div>

<div id="messages"></div>

<div id="expired">
  This chat link has expired. Please reopen <b>Live Support</b> from the NovaPlay app to start a new session.
</div>

<div id="composer">
  <textarea id="text" rows="1" placeholder="Type your message…"></textarea>
  <button id="send">Send</button>
</div>

<script>
  var API = location.origin;
  var params = new URLSearchParams(location.search);
  var token = params.get('token') || sessionStorage.getItem('novaplay_chat_token');

  if (params.get('token')) {
    sessionStorage.setItem('novaplay_chat_token', params.get('token'));
    history.replaceState(null, '', location.pathname);
  }

  var messagesEl = document.getElementById('messages');
  var textEl = document.getElementById('text');
  var sendBtn = document.getElementById('send');
  var expiredEl = document.getElementById('expired');
  var composerEl = document.getElementById('composer');
  var lastCount = 0;
  var serverMessages = [];
  // Quick questions answered right here (never sent to the team), merged
  // into the conversation by time; anything typed goes to a real person.
  var localMessages = [];
  var links = { websiteUrl: location.origin, appDownloadUrl: null, telegramUrl: null };
  fetch(API + '/support/config').then(function (r) { return r.json(); }).then(function (c) {
    links.websiteUrl = c.websiteUrl || links.websiteUrl;
    links.appDownloadUrl = c.appDownloadUrl;
    links.telegramUrl = c.telegramUrl;
    render();
  }).catch(function () {});

  var QUICK = [
    { label: 'Official Website', answer: function () { return 'Our official website is:\n' + links.websiteUrl + '\n\nOnly use this link. Never log in on a site someone else sends you.'; } },
    { label: 'APP Download', answer: function () { return links.appDownloadUrl ? 'Download the official NovaPlay app here:\n' + links.appDownloadUrl : 'The download link is not available right now. Please ask our team below.'; } },
    { label: 'Check my order', answer: function () { return '🤖 Type or paste your order number here (it starts with NP — find it in Deposit history or Withdraw history in the app) and I will check it right away.\n\nA paid deposit is added to your wallet at once.'; } },
    { label: 'Deposit Issue', answer: function () { return 'Deposit not added to your wallet?\n\n🤖 Type your deposit number here (Deposit history shows it, it starts with NP) and I will check it with the payment company right away. If it was paid, the money is added at once.\n\nStill missing? Use Customer Service → Deposit Not Receive in the app with your UTR and a screenshot of the payment.'; } },
    { label: 'Withdraw Issue', answer: function () { return 'We are here to help with your withdrawal.\n\n🤖 Type your withdraw order number here (Withdraw history shows it, it starts with NPW) and I will tell you its status right away.\n\nFor anything else send:\n1. UID\n2. Withdraw order number\n3. Withdrawal amount\n4. Screenshot of the withdraw history\n\nor use Customer Service → Withdrawal Problem in the app to attach the screenshot.'; } },
    { label: 'Game Issue', answer: function () { return 'Tell us:\n1. The game name\n2. The round / period number and time\n3. Your bet amount and what went wrong\n\nPull down on any game to reload it if it seems stuck — a bet already placed is never lost.'; } },
    { label: 'Bonus Detail', answer: function () { return 'Bonuses:\n• Deposit bonus — shown on the Deposit screen; it unlocks after its wagering is played.\n• VIP upgrade & monthly bonus — Profile → VIP.\n• Invite rewards — Invite page.\n• Gift codes — the gift box on Home.\n\nAsk below if a bonus did not arrive.'; } },
  ];
  function quickList() {
    return links.telegramUrl ? QUICK.concat([{ label: 'Official Channel', answer: function () { return 'Join our official Telegram channel:\n' + links.telegramUrl; } }]) : QUICK;
  }
  function askQuick(i) {
    var q = quickList()[i];
    if (!q) return;
    var now = new Date().toISOString();
    localMessages.push({ sender: 'USER', text: q.label, createdAt: now, local: true });
    localMessages.push({ sender: 'ADMIN', text: q.answer(), createdAt: now, local: true, bot: true });
    render();
  }

  function showExpired() {
    expiredEl.style.display = 'block';
    messagesEl.style.display = 'none';
    composerEl.style.display = 'none';
  }

  if (!token) {
    showExpired();
  } else {
    boot();
  }

  function bubbleHtml(m) {
    var cls = m.sender === 'USER' ? 'user' : 'admin';
    var time = new Date(m.createdAt).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
    return '<div class="bubble ' + cls + '">' + linkify(escapeHtml(m.text)) + '<div class="meta">' + (m.bot ? 'Auto reply · ' : '') + time + '</div></div>';
  }
  function linkify(html) {
    return html.replace(/https?:\/\/[^\s<]+/g, function (u) { return '<a href="' + u + '" target="_blank" rel="noopener">' + u + '</a>'; });
  }
  function welcomeHtml() {
    var chips = quickList().map(function (q, i) { return '<button class="chip" data-q="' + i + '">' + escapeHtml(q.label) + '</button>'; }).join('');
    return '<div class="bubble admin">📌 Welcome to NovaPlay 24-hour Customer Support!\n\n🤖 Type your deposit or withdraw order number (it starts with NP) and I check it instantly. Or pick a question below, or type your message for our team.' +
      (links.appDownloadUrl ? '\n\nOfficial app: ' + linkify(escapeHtml(links.appDownloadUrl)) : '') +
      '\n\n🔔 <b>Security reminder:</b> we will never ask for your OTP or password.</div>' +
      '<div class="chips-title">I guess you want to ask</div><div class="chips">' + chips + '</div>';
  }

  function escapeHtml(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function render() {
    var all = serverMessages.concat(localMessages).sort(function (a, b) { return new Date(a.createdAt) - new Date(b.createdAt); });
    messagesEl.innerHTML = welcomeHtml() + all.map(bubbleHtml).join('');
    messagesEl.scrollTop = messagesEl.scrollHeight;
    lastCount = serverMessages.length;
  }
  messagesEl.addEventListener('click', function (e) {
    var chip = e.target.closest && e.target.closest('.chip');
    if (chip) askQuick(Number(chip.getAttribute('data-q')));
  });

  function loadChat() {
    fetch(API + '/support/chat', { headers: { Authorization: 'Bearer ' + token } })
      .then(function (r) {
        if (r.status === 401) { showExpired(); throw new Error('expired'); }
        return r.json();
      })
      .then(function (data) {
        if (data.messages.length !== lastCount) { serverMessages = data.messages; render(); }
      })
      .catch(function () {});
  }

  // An order number in the message ("NP…" / "NPW…") is checked by the bot at once.
  var ORDER_RE = /\b(NP-?[A-Z0-9]{6,})\b/i;
  function checkOrder(orderRef, text, done) {
    fetch(API + '/support/chat/check-order', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ orderRef: orderRef, text: text }),
    })
      .then(function (r) {
        if (r.status === 401) { showExpired(); throw new Error('expired'); }
        return r.json().then(function (b) { return { ok: r.ok, body: b }; });
      })
      .then(function (res) {
        if (!res.ok) {
          var now = new Date().toISOString();
          localMessages.push({ sender: 'ADMIN', text: '🤖 ' + (res.body.error || 'Could not check this order. Please try again.'), createdAt: now, local: true, bot: true });
          render();
        }
        textEl.value = '';
        lastCount = -1;
        loadChat();
      })
      .catch(function () {})
      .finally(done);
  }

  function send() {
    var text = textEl.value.trim();
    if (!text) return;
    sendBtn.disabled = true;
    var order = text.match(ORDER_RE);
    if (order) { checkOrder(order[1], text, function () { sendBtn.disabled = false; }); return; }
    fetch(API + '/support/chat/message', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: 'Bearer ' + token },
      body: JSON.stringify({ text: text }),
    })
      .then(function (r) {
        if (r.status === 401) { showExpired(); throw new Error('expired'); }
        return r.json();
      })
      .then(function () {
        textEl.value = '';
        loadChat();
      })
      .catch(function () {})
      .finally(function () { sendBtn.disabled = false; });
  }

  sendBtn.addEventListener('click', send);
  textEl.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' && !e.shiftKey) {
      e.preventDefault();
      send();
    }
  });

  function boot() {
    render();
    loadChat();
    setInterval(loadChat, 4000);
  }
</script>

</body>
</html>
